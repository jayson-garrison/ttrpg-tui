name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # No root Cargo.toml yet: every Rust step is skipped and the job passes.
      # The gates run automatically once a workspace exists.
      - name: Detect Cargo workspace
        id: cargo
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No Cargo.toml yet; skipping Rust gates."; fi

      - name: Install stable Rust
        if: steps.cargo.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.cargo.outputs.present == 'true'

      - name: fmt
        if: steps.cargo.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: clippy
        if: steps.cargo.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        if: steps.cargo.outputs.present == 'true'
        run: cargo build --workspace --all-targets

      - name: test
        if: steps.cargo.outputs.present == 'true'
        run: cargo test --workspace
