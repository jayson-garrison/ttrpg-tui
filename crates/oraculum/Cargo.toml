[package]
name = "oraculum"
description = "Terminal utility for solo and GMless tabletop RPG play"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "oraculum_app"
path = "src/lib.rs"

[[bin]]
name = "oraculum"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
oraculum-core = { path = "../oraculum-core" }
ratatui = "0.30.2"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
tempfile = "3.27.0"
