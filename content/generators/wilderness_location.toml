name = "Wilderness location"
category = "Places"
tags = ["wilderness", "place"]
description = "A stretch of wilderness with a landmark, a feature, a danger and maybe a resident."
template = "Terrain: {terrain}. Landmark: {landmark}.\nFeature: {feature}. Danger: {danger}.\nResident: {resident}"

[[slots]]
key = "terrain"
table = "terrain"

[[slots]]
key = "landmark"
table = "wild_landmark"

[[slots]]
key = "feature"
table = "wild_feature"

[[slots]]
key = "danger"
table = "wild_danger"

[[slots]]
key = "resident"
table = "wild_resident"
chance = 50
